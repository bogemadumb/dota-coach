# Item constraints for patch 7.41f. Keys are KB item keys (data/kb/items/<key>.json).
# Sources: mechanics_a.md / mechanics_b.md (section in `src`) and the official item texts in the KB.
# Fields (all optional):
#   melee_only / ranged_only   core effect works only for that attack type
#   ranged_penalty             {melee, ranged, what}: same effect, weaker for ranged
#   melee_penalty              the item's range/split bonus works only for ranged heroes
#   works_on_illusions         false | partial | true
#   unique_group               key of `groups`: sources of one group do not stack
#   pierces_debuff_immunity    true | false
#   dispel                     basic | strong: dispel the item applies when used
#   dispellable_by             basic | strong | no: how the effect/debuff of the item can be removed
#   blocked_for_heroes         heroes for whom the main effect does not work at all
#   removed                    no longer in the game (KB shop.status == removed)
#   why                        one-line Russian reasons, keyed by the field that caused the mismatch
patch: "7.41f"

illusion_heroes: [phantom_lancer, naga_siren, terrorblade, spectre, chaos_knight]

groups:
  crit: {items: [lesser_crit, greater_crit, revenants_brooch], rule: "криты не стакаются: бросается сильнейший множитель, остальные игнорируются", src: "mechanics_a 11"}
  bash: {items: [basher, abyssal_blade], rule: "Bash не стакается: работает источник, дольше лежащий в инвентаре", src: "mechanics_a 11"}
  armor_reduction: {items: [desolator, orb_of_corrosion, blight_stone], rule: "снижения брони не стакаются между собой", src: "mechanics_a 2"}
  slow_and_restoration: {items: [orb_of_frost, orb_of_corrosion, skadi], rule: "замедление и снижение Health Restoration у этих предметов не стакаются", src: "mechanics_a 10"}
  range_bonus: {items: [monkey_king_bar, dragon_lance, hurricane_pike, hydras_breath], rule: "бонусы дальности атаки от MKB и предметов на основе Dragon Lance не стакаются", src: "mechanics_b 3"}
  diffusal: {items: [diffusal_blade, disperser], rule: "несколько Diffusal не стакаются", src: "mechanics_a 11"}
  spell_weakness: {items: [bloodstone, veil_of_discord], rule: "Spell Weakness от Bloodstone и Veil of Discord не стакается", src: "mechanics_a 4"}
  kaya_spell_amp: {items: [kaya, kaya_and_sange, yasha_and_kaya], rule: "усиление заклинаний семейства Kaya не стакается", src: "mechanics_a 4"}
  sange_family: {items: [sange, sange_and_yasha, kaya_and_sange, abyssal_blade], rule: "бонусы на основе Sange (сопротивление статусам, Health Restoration) не стакаются, берётся максимум", src: "mechanics_a 9, 10"}
  yasha_speed: {items: [yasha, sange_and_yasha, yasha_and_kaya, manta], rule: "процент скорости движения на основе Yasha не стакается", src: "mechanics_a 12"}
  heal_aura: {items: [mekansm, guardian_greaves], rule: "аура регенерации не стакается между Mekansm и Guardian Greaves", src: "mechanics_b 2"}
  damage_block: {items: [vanguard, crimson_guard], rule: "блок урона нескольких источников не стакается", src: "mechanics_b 2"}

